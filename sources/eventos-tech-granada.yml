# First real example, used to validate the pipeline end-to-end against a public .ics
# (241 events, times in UTC → converted to Europe/Madrid, 0 invalid).
#
# `enabled: false` on purpose: NOT published yet. The license gate only applies to
# enabled sources, so a source can live here while its license is confirmed. Before
# setting `enabled: true` you must fill in ONE of the two routes:
#   - `license:` with an allowlist id (CC0-1.0 / CC-BY-4.0) verifiable at the origin, or
#   - the `permission:` block linking the issue where the organiser grants permission.
# This Google calendar declares no license, so today it meets neither.
