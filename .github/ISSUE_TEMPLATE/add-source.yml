name: Add a source (.ics)
description: Register a public iCalendar so its events enter the feed.
title: 'Source: <community name>'
labels: [source]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a source. A bot reads this issue and opens a PR with the
        `sources/<id>.yml` file; a human reviews it before merging.

        The PR runs a *dry-run*: you will see how many events would enter, and what they look
        like, before anything is published.
  - type: input
    id: id
    attributes:
      label: Identifier (slug)
      description: Lowercase, hyphens. It becomes the file name. E.g. `rust-madrid`.
      placeholder: rust-madrid
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: .ics URL
      description: The public link to the iCalendar.
      placeholder: https://rustmadrid.example/events.ics
    validations:
      required: true
  - type: input
    id: timezone
    attributes:
      label: Timezone (IANA)
      description: >-
        Which timezone the events happen in. Required: iCalendar often omits it and we do not
        guess. E.g. `Europe/Madrid`, `America/Mexico_City`.
      placeholder: Europe/Madrid
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Community name
      placeholder: Rust Madrid
    validations:
      required: true
  - type: input
    id: homepage
    attributes:
      label: Community website
      placeholder: https://rustmadrid.example
  - type: dropdown
    id: attendance
    attributes:
      label: Default attendance mode
      description: >-
        Only if EVERY event from this source has the same mode. When in doubt, leave it as
        "do not force": the system infers it when the signal is unambiguous and omits it otherwise.
      options:
        - 'do not force (recommended)'
        - in-person
        - online
        - hybrid
      default: 0
  - type: dropdown
    id: license
    attributes:
      label: Under what rights can we republish this data?
      options:
        - 'I am an organiser and grant permission to publish it as open data (CC-BY-4.0)'
        - 'The source is already licensed CC-BY-4.0'
        - 'The source is already licensed CC0-1.0'
    validations:
      required: true
  - type: checkboxes
    id: license-confirm
    attributes:
      label: License confirmation (required)
      description: >-
        Without this it cannot be published. A reachable `.ics` is not the same as a reusable one.
      options:
        - label: >-
            I declare that this data can be published as open data under CC-BY-4.0, because I am an
            organiser and grant permission, or because the source already allows it with an open license.
          required: true
